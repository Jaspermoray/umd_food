name: Sync free food to Google Calendar

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), at :17 to avoid the top-of-hour rush
  workflow_dispatch:          # lets you trigger a run manually from the Actions tab

permissions:
  contents: write             # needed to commit the updated database back

concurrency:
  group: sync                 # never run two syncs at once (would create duplicates)
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sync
        env:
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
          python -m freefood sync
          rm credentials.json

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freefood.db
          git diff --cached --quiet || git commit -m "Update event database [skip ci]"
          git push
